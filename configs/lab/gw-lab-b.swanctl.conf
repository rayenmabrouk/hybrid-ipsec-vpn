# gw-lab-b - responder (simulated remote site 10.20.0.0/16)
connections {
  site-to-site {
    version = 2
    local_addrs  = 192.168.100.12
    remote_addrs = 192.168.100.11
    # Hybrid post-quantum key exchange: ECDH P-384 + ML-KEM-768 (RFC 9370)
    proposals = aes256gcm16-prfsha384-ecp384-ke1_mlkem768
    dpd_delay = 30s
    local {
      auth  = pubkey
      certs = gw-lab-b.crt
      id    = gw-lab-b.vpn.internal
    }
    remote {
      auth    = pubkey
      id      = gw-onprem.vpn.internal
      cacerts = lab-ca.crt
    }
    children {
      lan {
        local_ts  = 10.20.0.0/16
        remote_ts = 10.10.0.0/24
        # PFS on every rekey, also hybrid post-quantum
        esp_proposals = aes256gcm16-ecp384-ke1_mlkem768
        dpd_action = clear
      }
    }
  }
}
