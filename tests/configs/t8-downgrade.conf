# T8 - tentative de négociation affaiblie (sans ML-KEM), doit être refusée
# Usage : remplacer __GW_AWS_EIP__ par l'EIP de gw-aws, copier dans /etc/swanctl/conf.d/ sur gw-onprem,
#         swanctl --load-conns ; swanctl --initiate --ike t8-downgrade  -> NO_PROPOSAL_CHOSEN attendu
connections {
  t8-downgrade {
    version = 2
    remote_addrs = __GW_AWS_EIP__
    proposals = aes128-sha256-modp2048
    local {
      auth = pubkey
      id = gw-onprem.vpn.internal
    }
    remote {
      auth = pubkey
      id = gw-aws.vpn.internal
    }
    children {
      t8 {
        local_ts = 10.10.0.0/24
        remote_ts = 10.20.0.0/16
        esp_proposals = aes128-sha256
      }
    }
  }
}
