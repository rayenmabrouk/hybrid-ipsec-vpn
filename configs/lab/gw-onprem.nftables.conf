#!/usr/sbin/nft -f
flush ruleset

table ip nat {
  chain postrouting {
    type nat hook postrouting priority srcnat; policy accept;
    # LAN -> Internet is masqueraded; LAN -> remote site (10.20.0.0/16) is not, so IPsec policies match it
    oifname "eth0" ip saddr 10.10.0.0/24 ip daddr != 10.20.0.0/16 masquerade
  }
}
