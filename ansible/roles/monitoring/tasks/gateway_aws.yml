- name: Install boto3
  ansible.builtin.apt:
    name: python3-boto3
    update_cache: true
    cache_valid_time: 3600

- name: Install the CloudWatch metric publisher
  ansible.builtin.template:
    src: vpn-cloudwatch-metric.py.j2
    dest: /usr/local/bin/vpn-cloudwatch-metric
    mode: "0755"

- name: Install the systemd service and timer (every minute)
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    mode: "0644"
  loop:
    - vpn-metric.service
    - vpn-metric.timer
  vars:
    vpn_metric_command: /usr/local/bin/vpn-cloudwatch-metric
    vpn_metric_interval: 60s
  notify: Restart vpn-metric timer

- name: Enable the timer
  ansible.builtin.systemd_service:
    name: vpn-metric.timer
    enabled: true
    state: started
    daemon_reload: true
