- name: Restart vpn-metric timer
  ansible.builtin.systemd_service:
    name: vpn-metric.timer
    state: restarted
    daemon_reload: true

- name: Restart node_exporter
  ansible.builtin.service:
    name: prometheus-node-exporter
    state: restarted

- name: Restart prometheus
  ansible.builtin.service:
    name: prometheus
    state: restarted

- name: Restart grafana
  ansible.builtin.service:
    name: grafana-server
    state: restarted
