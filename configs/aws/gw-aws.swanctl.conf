# gw-aws - responder (AWS VPC 10.20.0.0/16), behind the Elastic IP 1:1 NAT
connections {
  site-to-site {
    version = 2
    local_addrs  = %any
    remote_addrs = %any          # on-prem site is behind NAT; identity is enforced by certificate
    # Hybrid post-quantum key exchange: ECDH P-384 + ML-KEM-768 (RFC 9370)
    proposals = aes256gcm16-prfsha384-ecp384-ke1_mlkem768
    dpd_delay = 30s
    local {
      auth  = pubkey
      certs = gw-aws.crt
      id    = gw-aws.vpn.internal
    }
    remote {
      auth    = pubkey
      id      = gw-onprem.vpn.internal
      cacerts = lab-ca.crt
    }
    children {
      lan {
        local_ts  = 10.20.0.0/16
        remote_ts = 10.10.0.0/24
        esp_proposals = aes256gcm16-ecp384-ke1_mlkem768
        dpd_action = clear
      }
    }
  }
}
