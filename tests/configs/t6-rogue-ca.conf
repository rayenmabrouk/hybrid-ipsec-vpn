# T6 - usurpation : certificat émis par une AC non reconnue, doit être refusé
# Usage : certificat rogue-gw.crt (AC « Rogue Root CA », CN=gw-onprem.vpn.internal) dans /etc/swanctl/x509/,
#         sa clé dans /etc/swanctl/private/ ; remplacer __GW_AWS_EIP__ ; swanctl --load-all ;
#         swanctl --initiate --ike t6-rogue  -> AUTHENTICATION_FAILED attendu
connections {
  t6-rogue {
    version = 2
    remote_addrs = __GW_AWS_EIP__
    proposals = aes256gcm16-prfsha384-ecp384-ke1_mlkem768
    local {
      auth = pubkey
      certs = rogue-gw.crt
      id = gw-onprem.vpn.internal
    }
    remote {
      auth = pubkey
      id = gw-aws.vpn.internal
    }
    children {
      t6 {
        local_ts = 10.10.0.0/24
        remote_ts = 10.20.0.0/16
        esp_proposals = aes256gcm16-ecp384-ke1_mlkem768
      }
    }
  }
}
