# T7 - certificat signé par la bonne AC mais révoqué (CRL), doit être refusé
# Usage : t7.crt dans /etc/swanctl/x509/, t7.key dans /etc/swanctl/private/ ; remplacer __GW_AWS_EIP__ ;
#         swanctl --load-all ; swanctl --initiate --ike t7-revoked  -> AUTHENTICATION_FAILED attendu
connections {
  t7-revoked {
    version = 2
    remote_addrs = __GW_AWS_EIP__
    proposals = aes256gcm16-prfsha384-ecp384-ke1_mlkem768
    local {
      auth = pubkey
      certs = t7.crt
      id = gw-onprem.vpn.internal
    }
    remote {
      auth = pubkey
      id = gw-aws.vpn.internal
    }
    children {
      t7 {
        local_ts = 10.10.0.0/24
        remote_ts = 10.20.0.0/16
        esp_proposals = aes256gcm16-ecp384-ke1_mlkem768
      }
    }
  }
}
